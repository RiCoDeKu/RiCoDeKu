name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=onedark&locale=ja
          path: images/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=onedark&locale=ja
          path: images/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate profile trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: images/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: onedark
          cols: -1
          rows: 1
          margin-width: 10
          margin-height: 10
          no-background: false
          no-frame: false

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile cards"
          git push